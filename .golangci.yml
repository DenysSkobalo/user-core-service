version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  disable-all: true
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - misspell

formatters:
  enable:
    - gofumpt

linters-settings:
  govet:
    check-shadowing: true 
  misspell:
    locale: US 

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
