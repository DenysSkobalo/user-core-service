services:
  user_db_shard_1:
    image: postgres:15-alpine
    container_name: user_db_shard_1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: user_core_shard_1
    volumes:
      - pg_shard_1_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d user_core_shard_1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - user_network

  user_db_shard_2:
    image: postgres:15-alpine
    container_name: user_db_shard_2
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: user_core_shard_2
    volumes:
      - pg_shard_2_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d user_core_shard_2"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - user_network

  user_cache:
    image: redis:7-alpine
    container_name: user_cache
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    volumes:
      - redis_cache_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - user_network

  migrate_shard_1:
    image: migrate/migrate
    volumes:
      - ./migrations:/migrations
    command:
      - -path=/migrations
      - -database=postgres://postgres:postgres@user_db_shard_1:5432/user_core_shard_1?sslmode=disable
      - up
    depends_on:
      user_db_shard_1:
        condition: service_healthy
    networks:
      - user_network

  migrate_shard_2:
    image: migrate/migrate
    volumes:
      - ./migrations:/migrations
    command:
      - -path=/migrations
      - -database=postgres://postgres:postgres@user_db_shard_2:5432/user_core_shard_2?sslmode=disable
      - up
    depends_on:
      user_db_shard_2:
        condition: service_healthy
    networks:
      - gostream-hub_network

  gostream-hub:
    build: .
    container_name: gostream-hub
    ports:
      - "8080:8080"
    environment:
      - SERVER_TIMEOUT=25
      - WORKER_COUNT=10
      - APP_PORT=:8080
      - LOG_LEVEL=info
      - SHARD_1_DSN=postgres://postgres:postgres@user_db_shard_1:5432/user_core_shard_1?sslmode=disable
      - SHARD_2_DSN=postgres://postgres:postgres@user_db_shard_2:5432/user_core_shard_2?sslmode=disable
      - REDIS_ADDR=user_cache:6379
    depends_on:
      user_db_shard_1:
        condition: service_healthy
      user_db_shard_2:
        condition: service_healthy
      user_cache:
        condition: service_healthy
    networks:
      - gostream-hub_network

  # --- PLG Stack ---
  loki:
    image: grafana/loki:latest
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - gostream-hub_network

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    networks:
      - gostream-hub_network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - loki
    networks:
      - gostream-hub_network

volumes:
  pg_shard_1_data:
  pg_shard_2_data:
  redis_cache_data:

networks:
  gostream-hub_network:
    driver: bridge
