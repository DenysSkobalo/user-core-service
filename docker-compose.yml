version: '3.8'

services:
  user_db_shard_1:
    image: postgres:15-alpine
    container_name: user_db_shard_1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: user_core_shard_1
    ports:
      - "5431:5432"
    volumes:
      - pg_shard_1_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d user_core_shard_1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - user_network

  user_db_shard_2:
    image: postgres:15-alpine
    container_name: user_db_shard_2
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: user_core_shard_2
    ports:
      - "5432:5432"
    volumes:
      - pg_shard_2_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d user_core_shard_2"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - user_network

  user_cache:
    image: redis:7-alpine
    container_name: user_cache
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis_cache_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - user_network

  migrate_shard_1:
    image: migrate/migrate
    container_name: migrate_shard_1
    volumes:
      - ./migrations:/migrations
    command:
      - -path=/migrations
      - -database=postgres://postgres:postgres@user_db_shard_1:5432/user_core_shard_1?sslmode=disable
      - up
    depends_on:
      user_db_shard_1:
        condition: service_healthy
    networks:
      - user_network

  migrate_shard_2:
    image: migrate/migrate
    container_name: migrate_shard_2
    volumes:
      - ./migrations:/migrations
    command:
      - -path=/migrations
      - -database=postgres://postgres:postgres@user_db_shard_2:5432/user_core_shard_2?sslmode=disable
      - up
    depends_on:
      user_db_shard_2:
        condition: service_healthy
    networks:
      - user_network

  user_app:
    build: .
    container_name: user_app
    ports:
      - "8080:8080"
    environment:
      - APP_PORT=:8080
      - LOG_LEVEL=info
      - SHARD_1_DSN=postgres://postgres:postgres@user_db_shard_1:5432/user_core_shard_1?sslmode=disable
      - SHARD_2_DSN=postgres://postgres:postgres@user_db_shard_2:5432/user_core_shard_2?sslmode=disable
      - REDIS_ADDR=user_cache:6379
    depends_on:
      user_db_shard_1:
        condition: service_healthy
      user_db_shard_2:
        condition: service_healthy
      user_cache:
        condition: service_healthy
    networks:
      - user_network

volumes:
  pg_shard_1_data:
    driver: local
  pg_shard_2_data:
    driver: local
  redis_cache_data:
    driver: local

networks:
  user_network:
    driver: bridge
